name: Update patent cards and nav font

on:
  push:
    paths:
      - '.github/workflows/update-patent-nav.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply requested website edits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()
          role_line = '          <p><strong>Role:</strong> One of the contributors to this invention.</p>\n'
          s = s.replace(role_line, '')
          if 'One of the contributors to this invention.' in s:
              raise SystemExit('Patent role text still present')

          old = '.rt-nav a{color:var(--rt-accent-dark);font-weight:700;font-size:.9rem;text-decoration:none}'
          new = '.rt-nav a{color:var(--rt-accent-dark);font-weight:700;font-size:1rem;text-decoration:none}'
          if old not in s:
              raise SystemExit('Desktop nav CSS not found')
          s = s.replace(old, new, 1)

          old_mobile = '@media(max-width:760px){.rt-nav{position:static;padding:.7rem 3vw}.rt-nav a{font-size:.84rem}}'
          new_mobile = '@media(max-width:760px){.rt-nav{position:static;padding:.7rem 3vw}.rt-nav a{font-size:.92rem}}'
          if old_mobile not in s:
              raise SystemExit('Mobile nav CSS not found')
          s = s.replace(old_mobile, new_mobile, 1)

          p.write_text(s)
          PY
          rm -f .github/workflows/update-patent-nav.yml

      - name: Commit website edits
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refine patent cards and navigation font'
          git push
