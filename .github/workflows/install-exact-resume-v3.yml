name: Install exact resume PDF v3

on:
  push:
    paths:
      - '.resume-upload-v2/TRIGGER3'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild exact uploaded PDF
        shell: bash
        run: |
          set -euo pipefail
          cat .resume-upload-v2/part*.b64 | base64 --decode > RT_Resume_CU.pdf
          test "$(stat -c%s RT_Resume_CU.pdf)" = "127138"
          test "$(git hash-object RT_Resume_CU.pdf)" = "2877217c4c7ca13036ee8bed77318f714994fbaf"
          echo "c2ef3364b07830a53b63425b9ce9bf9409b55f9bbbf3dc6aa422f11398d4da88  RT_Resume_CU.pdf" | sha256sum -c -
          file RT_Resume_CU.pdf | grep -q 'PDF document'

      - name: Use direct GitHub Pages resume link
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'href="https://github.com/RajavardhanT/RajavardhanT.github.io/blob/master/RT_Resume_CU.pdf"'
          new = 'href="/RT_Resume_CU.pdf"'
          if old in s:
              s = s.replace(old, new)
          elif new not in s:
              raise SystemExit('Resume link not found in index.html')
          p.write_text(s)
          PY

      - name: Commit resume and clean staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .resume-upload-v2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install exact resume PDF and use direct site link"
          git push
