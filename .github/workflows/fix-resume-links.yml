name: Fix resume links

on:
  push:
    paths:
      - '.github/workflows/fix-resume-links.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point Resume buttons directly to uploaded PDF
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'https://github.com/RajavardhanT/RajavardhanT.github.io/blob/master/RT_Resume_CU.pdf'
          new = '/RT_Resume_CU.pdf'
          s2 = s.replace(old, new)
          if s2 == s:
              raise SystemExit('No old resume links found')
          if s2.count(new) < 2:
              raise SystemExit('Expected two direct resume links')
          p.write_text(s2)
          PY
          rm -f .github/workflows/fix-resume-links.yml
      - name: Commit link fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use direct resume PDF links'
          git push
