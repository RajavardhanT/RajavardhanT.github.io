name: Finalize portfolio fixes

on:
  push:
    paths:
      - '.github/workflows/finalize-site.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and finalize site
        shell: bash
        run: |
          set -e
          file RT_Resume_CU.pdf | grep -q 'PDF document'
          sed -i 's|href="/RT_Resume_CU.pdf"|href="https://github.com/RajavardhanT/RajavardhanT.github.io/blob/master/RT_Resume_CU.pdf"|g' index.html
          grep -q 'mailto:trvabc@gmail.com">trvabc@gmail.com</a>' index.html
          grep -q 'src="/LinkedIn_Posts_Summary.png"' index.html
          rm -rf .resume-upload .resume_tmp _tmp_resume_marker.txt
          rm -f .github/workflows/install-exact-resume.yml .github/workflows/install-resume.yml .github/workflows/replace-resume.yml
          rm -f .github/workflows/finalize-site.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize resume link and portfolio fixes"
          git push
