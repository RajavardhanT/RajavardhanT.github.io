name: Revert academic style
on:
  push:
    paths:
      - '.github/workflows/revert-academic-style.yml'
permissions:
  contents: write
jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore previous inline nav styling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          marker = '  <link rel="stylesheet" href="/assets/css/custom.css">\n'
          style = '''  <style>\n    .rt-nav{position:sticky;top:0;z-index:100;background:rgba(235,240,246,.98);backdrop-filter:blur(12px);border-bottom:2px solid rgba(43,75,105,.18);box-shadow:0 3px 12px rgba(28,48,68,.08);margin:0 calc(50% - 50vw);padding:.85rem max(4vw,calc((100vw - 1120px)/2));display:flex;gap:1.15rem;flex-wrap:wrap;align-items:center;justify-content:center}\n    .rt-nav a{color:var(--rt-accent-dark);font-weight:750;font-size:1.15rem;letter-spacing:.01em;text-decoration:none;padding:.28rem .42rem;border-radius:.38rem;transition:background .18s ease,color .18s ease}\n    .rt-nav a:hover{color:var(--rt-accent);background:rgba(43,75,105,.08);text-decoration:none}\n    .rt-profile-label{width:100%;margin:.8rem 0 -.25rem;color:var(--rt-muted);font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}\n    @media(max-width:760px){.rt-nav{position:static;padding:.72rem 3vw;gap:.55rem .8rem;justify-content:center}.rt-nav a{font-size:1.02rem;padding:.22rem .3rem}}\n  </style>\n'''
          if '<style>\n    .rt-nav{' not in s:
              s = s.replace(marker, marker + style, 1)
          p.write_text(s)
          PY
      - name: Remove helper workflow
        run: rm .github/workflows/revert-academic-style.yml
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html .github/workflows/revert-academic-style.yml
          git commit -m "Restore previous portfolio style"
          git push
