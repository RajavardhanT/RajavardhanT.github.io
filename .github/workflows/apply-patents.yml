name: Apply patent contributions

on:
  push:
    paths:
      - '.github/workflows/apply-patents.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update patents section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          old_bullet = '<li>Named inventor on patent-related Rydberg RF sensing work.</li>'
          new_bullet = '<li>Contributor to patent-related Rydberg RF sensing and field-imaging inventions.</li>'
          if s.count(old_bullet) != 1:
              raise SystemExit(f'Expected exactly one old patent bullet; found {s.count(old_bullet)}')
          s = s.replace(old_bullet, new_bullet, 1)

          old_section = '''    <section class="rt-section" id="patents">
      <h2>Patents & Inventions</h2>
      <div class="rt-card">
        <p class="rt-meta">Rydberg RF Sensing • Patent-related work</p>
        <h3>Subwavelength RF Angle-of-Arrival Sensing</h3>
        <p>
          Inventor on patent-related work associated with a novel Rydberg-atom approach for determining RF angle of arrival using subwavelength, amplitude-only measurements. Public patent identifiers and filing details are omitted here until they are available for disclosure.
        </p>
      </div>
    </section>'''

          new_section = '''    <section class="rt-section" id="patents">
      <h2>Patents & Inventions</h2>
      <p class="rt-meta">Contributor to patent-related Rydberg sensing inventions</p>

      <div class="rt-grid">
        <article class="rt-card">
          <p class="rt-meta">Patent-related Invention 1 • Rydberg Field Imaging</p>
          <h3>2D electromagnetic field imager using light-sheet fluorescence spectroscopy of Rydberg states</h3>
          <p><strong>Role:</strong> One of the contributors to this invention.</p>
          <p>
            This invention enables two-dimensional imaging of electric and magnetic fields using light-sheet fluorescence detection of Rydberg atoms in a vapor cell. By combining electromagnetically induced transparency (EIT) with imaging of planar laser-induced fluorescence, the technique provides minimally invasive, broadband, and SI-traceable field measurements with spatial resolution down to 160 μm and sensitivity to fields as low as 5 mV/cm. It allows imaging of both resonant and non-resonant RF electric fields from MHz to tens of GHz, as well as static magnetic fields, without the need for external calibration. The method offers a compact, scalable platform for high-resolution field mapping across scientific, industrial, and defense applications.
          </p>
        </article>

        <article class="rt-card">
          <p class="rt-meta">Patent-related Invention 2 • Rydberg RF Angle of Arrival</p>
          <h3>Rydberg Electrode Cell Angle of Arrival Estimator</h3>
          <p><strong>Role:</strong> One of the contributors to this invention.</p>
          <p>
            Deep subwavelength RF imaging with atomic Rydberg sensors has overcome fundamental limitations of traditional antennas and enabled ultra-wideband detection of omni-directional time varying fields all in a compact form factor. However, in most applications, Rydberg sensors require the use of a secondary strong RF reference field to serve as a phase reference. Here, we demonstrate a new type of Rydberg sensor for angle-of-arrival (AoA) sensing which utilizes subwavelength imaging of standing wave fields. By placing a metallic plate within the Rydberg cell, we can determine the AoA independent of the strength of incoming RF field and without requiring a secondary strong RF phase reference field.
          </p>
        </article>
      </div>
    </section>'''

          if s.count(old_section) != 1:
              raise SystemExit(f'Expected exactly one old patents section; found {s.count(old_section)}')
          s = s.replace(old_section, new_section, 1)
          p.write_text(s)
          PY

      - name: Commit update
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-patents.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-patents.yml
          git commit -m "Add Rydberg patent contributions"
          git push
