name: Increase top navigation font size

on:
  push:
    paths:
      - '.github/workflows/increase-nav-font.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Increase navigation font size
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('font-size:1rem;text-decoration:none', 'font-size:1.15rem;text-decoration:none')
          s = s.replace('.rt-nav a{font-size:.92rem}', '.rt-nav a{font-size:1.02rem}')
          p.write_text(s)
          PY
          rm -f .github/workflows/increase-nav-font.yml
      - name: Commit navigation font update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Increase top navigation font size'
          git push
