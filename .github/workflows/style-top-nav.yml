name: Style top navigation

on:
  push:
    paths:
      - '.github/workflows/style-top-nav.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Center and emphasize navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '''    .rt-nav{position:sticky;top:0;z-index:100;background:rgba(243,245,246,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--rt-line);margin:0 calc(50% - 50vw);padding:.7rem max(4vw,calc((100vw - 1120px)/2));display:flex;gap:.9rem;flex-wrap:wrap;align-items:center}\n    .rt-nav a{color:var(--rt-accent-dark);font-weight:700;font-size:1.15rem;text-decoration:none}\n    .rt-nav a:hover{color:var(--rt-accent);text-decoration:underline}\n    .rt-profile-label{width:100%;margin:.8rem 0 -.25rem;color:var(--rt-muted);font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}\n    @media(max-width:760px){.rt-nav{position:static;padding:.7rem 3vw}.rt-nav a{font-size:1.02rem}}'''
          new = '''    .rt-nav{position:sticky;top:0;z-index:100;background:rgba(235,240,246,.98);backdrop-filter:blur(12px);border-bottom:2px solid rgba(43,75,105,.18);box-shadow:0 3px 12px rgba(28,48,68,.08);margin:0 calc(50% - 50vw);padding:.85rem max(4vw,calc((100vw - 1120px)/2));display:flex;gap:1.15rem;flex-wrap:wrap;align-items:center;justify-content:center}\n    .rt-nav a{color:var(--rt-accent-dark);font-weight:750;font-size:1.15rem;letter-spacing:.01em;text-decoration:none;padding:.28rem .42rem;border-radius:.38rem;transition:background .18s ease,color .18s ease}\n    .rt-nav a:hover{color:var(--rt-accent);background:rgba(43,75,105,.08);text-decoration:none}\n    .rt-profile-label{width:100%;margin:.8rem 0 -.25rem;color:var(--rt-muted);font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}\n    @media(max-width:760px){.rt-nav{position:static;padding:.72rem 3vw;gap:.55rem .8rem;justify-content:center}.rt-nav a{font-size:1.02rem;padding:.22rem .3rem}}'''
          if old not in s:
              raise SystemExit('Expected navigation CSS not found')
          p.write_text(s.replace(old, new))
          PY
          rm -f .github/workflows/style-top-nav.yml
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Center and emphasize top navigation'
          git push