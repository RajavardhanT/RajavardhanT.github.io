name: Academic Pages style cleanup
on:
  push:
    paths:
      - '.github/workflows/academicpages-style-cleanup.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove old inline navigation styling
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          new, n = re.subn(r'\n\s*<style>.*?</style>\s*\n', '\n', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected one inline style block, found {n}')
          p.write_text(new)
          PY
      - name: Commit changes and remove helper workflow
        run: |
          rm .github/workflows/academicpages-style-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/academicpages-style-cleanup.yml
          git commit -m 'Use Academic Pages inspired layout'
          git push
