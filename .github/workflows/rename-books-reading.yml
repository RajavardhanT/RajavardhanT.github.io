name: Rename Books nav label to Reading

on:
  push:
    paths:
      - '.github/workflows/rename-books-reading.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename Books to Reading in top navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<a href="/books/">Books</a>'
          new = '<a href="/books/">Reading</a>'
          if old not in s:
              raise SystemExit('Expected Books navigation link not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/rename-books-reading.yml
          git commit -m "Rename Books navigation label to Reading"
          git push
